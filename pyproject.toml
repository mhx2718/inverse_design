[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "guide-inverse-design"
version = "1.3.0"
description = "Reference implementation of GUIDe for uncertainty-informed inverse design of nonlinear functional responses."
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = { file = "LICENSE" }
authors = [
  { name = "Haoxuan Dylan Mu" },
  { name = "Mingjian Tang" },
  { name = "Wei Gao" },
  { name = "Wei Wayne Chen" },
]
dependencies = [
  "numpy>=1.26,<3",
  "scipy==1.15.1",
  "torch>=2.5,<3",
  "PyYAML>=6,<7",
  "tqdm>=4.66,<5",
]

[project.optional-dependencies]
airfoil = [
  "pyswarms>=1.3,<2",
  "pygad>=3.3,<4",
  "nvidia-cudnn-cu12==9.3.0.75; platform_system == 'Linux' and platform_machine == 'x86_64'",
]
nacre = [
  "tensorflow>=2.16,<2.22",
  "h5py>=3.10,<4",
  "pyswarms>=1.3,<2",
  "pygad>=3.3,<4",
  "nvidia-cudnn-cu12==9.3.0.75; platform_system == 'Linux' and platform_machine == 'x86_64'",
]
all = [
  "tensorflow>=2.16,<2.22",
  "h5py>=3.10,<4",
  "pyswarms>=1.3,<2",
  "pygad>=3.3,<4",
  "nvidia-cudnn-cu12==9.3.0.75; platform_system == 'Linux' and platform_machine == 'x86_64'",
]

[project.scripts]
guide = "guide.cli:main"
guide-airfoil = "guide.airfoil.cli:main"
guide-nacre = "guide.nacre.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
